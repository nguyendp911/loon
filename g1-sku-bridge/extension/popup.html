<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G1 SKU Bridge</title><link rel="stylesheet" href="style.css"></head>
<body><header><b>G1 SKU Bridge v2.1</b><small>Shadowrocket → Chrome/Edge</small></header>
<section><h3>Nhập nhật ký Shadowrocket</h3><p>Chỉ dán dòng [G1SKU], không dán cookie hoặc token.</p><textarea id="input" rows="7" placeholder="[G1SKU] g1.20tb.v2"></textarea><div class="actions"><button id="import">Nhập SKU</button><button id="clear">Xóa</button></div><p id="status"></p></section>
<section><h3>SKU đã lưu: <span id="count">0</span></h3><div id="saved"></div><button id="export">Xuất JSON</button></section>
<section><h3>So sánh trang Google One</h3><button id="scan">Quét trang hiện tại</button><p id="scanstatus"></p><div id="comparison"></div></section>
<footer>Chỉ đọc. Không sửa phản hồi hoặc giá thanh toán.</footer><script src="popup.js"></script></body></html>
